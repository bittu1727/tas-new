name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "Error: Active Java version could not be detected."
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or newer. Found: ${JAVA_MAJOR}"
            exit 1
          fi
          echo "Java environment verified: Java ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing file."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK file not found at: ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: APK file is empty: ${EXPECTED_APK}"
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension: ${EXPECTED_APK}"; exit 1 ;;
          esac

          echo "APK successfully verified at: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME="${RAW_REPO##*/}"
          SAFE_REPO_NAME=$(echo "${REPO_NAME}" | tr -cd 'a-zA-Z0-9_-')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "${RELEASE_DIR}"

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Failed to prepare release asset at ${ASSET_PATH}"
            exit 1
          fi

          echo "Prepared release asset: ${ASSET_PATH}"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared release asset is missing or empty: ${ASSET_PATH}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          RELEASE_NOTES=$(cat <<EOF
          ## Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${TARGET_COMMIT}
          - **Environment:** Ubuntu Runner (Java 17 Temurin, Gradle 9.3.1)

          > **Notice:** This APK is intended for testing and verification purposes only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${TARGET_COMMIT}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully!"
            echo "Tag: ${RELEASE_TAG}"
            echo "Title: Debug APK Build #${RUN_NUMBER}"
            echo "Asset: ${ASSET_FILENAME}"
            gh release view "${RELEASE_TAG}"
            
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url 2>/dev/null || echo "")
            if [ -n "${RELEASE_URL}" ]; then
              echo "Release Page URL: ${RELEASE_URL}"
            fi
            echo "=================================================="

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK has been published to GitHub Releases and is ready for download:"
              if [ -n "${RELEASE_URL}" ]; then
                echo "- **Release Page:** [View Release and Download APK](${RELEASE_URL})"
              fi
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Asset:** \`${ASSET_FILENAME}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release on your phone."
              echo ""
              echo "📦 **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact Name: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was compiled successfully, but GitHub Release creation encountered an issue or was skipped."
              echo ""
              echo "📦 **Download your APK:** The standard GitHub Actions artifact named **\`app-debug-apk\`** is available for download in the Artifacts section of this workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
